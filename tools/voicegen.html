<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice generator</title>
<style>
  body { margin: 0; padding: 24px 16px; font: 15px/1.5 system-ui, sans-serif; background: #0b0f18; color: #e9f3ff; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  #status { color: #7ff0e6; margin: 12px 0; }
  #log { font: 12px Consolas, monospace; color: #8fa2c4; white-space: pre-wrap; max-height: 60vh; overflow: auto; }
</style>
</head>
<body>
<!-- Makes Miku's voice for every line she says in src/story.js and saves it to models/voice.js.
     Serve the game with tools/serve.ps1 and open http://localhost:<port>/tools/voicegen.html.
     It picks up where it left off, so it's safe to close and reopen. Lines with the player's
     name in them are skipped: the game makes those while you play. -->
<h1>Miku voice generator</h1>
<div id="status">Starting…</div>
<div id="log"></div>
<script src="../src/voice.js"></script>
<script>
const statusEl = document.getElementById('status'), logEl = document.getElementById('log');
const log = (t) => { logEl.textContent = t + '\n' + logEl.textContent; };
window.gen = { done: 0, total: 0, state: 'starting', errors: 0 };

// Every line she says: "m: ..." strings in the story, in either kind of quotes.
function linesFrom(src) {
  const out = new Set();
  const re = /(["'])m: ((?:\\.|(?!\1).)*)\1/g;
  let m;
  while ((m = re.exec(src))) {
    const text = m[2].replace(/\\(["'\\])/g, '$1');
    if (text.includes('{name}')) { out.add(Voice.clean(Voice.withoutName(text))); continue; }
    out.add(Voice.clean(text));
  }
  out.add(Voice.clean("Hi! It's me, Miku. Is this how I sound?"));
  return [...out].filter((t) => /[a-z0-9]/i.test(t));
}

async function save(bank) {
  const body = '// Generated by tools/voicegen.html: Miku\'s spoken lines (Kokoro "' + Voice.VOICE_ID + '"), Opus-compressed. Do not edit by hand.\n'
    + 'window.MIKU_VOICE = ' + JSON.stringify({ voice: Voice.VOICE_ID, rate: 24000, lines: bank }) + ';\n';
  const r = await fetch('/__save/models/voice.js', { method: 'POST', body });
  if (!r.ok) throw new Error('save failed: ' + r.status);
}

(async () => {
  try {
    const src = await (await fetch('../src/story.js', { cache: 'no-store' })).text();
    const lines = linesFrom(src);
    let bank = {};
    try {
      const old = await (await fetch('../models/voice.js', { cache: 'no-store' })).text();
      const json = old.slice(old.indexOf('{'), old.lastIndexOf('}') + 1);
      bank = JSON.parse(json).lines || {};
    } catch (e) { /* first run */ }
    // Keep only lines still in the story.
    const keep = {};
    for (const t of lines) if (bank[t]) keep[t] = bank[t];
    bank = keep;
    const todo = lines.filter((t) => !bank[t]);
    gen.total = lines.length; gen.done = lines.length - todo.length;
    statusEl.textContent = `${gen.done} of ${gen.total} lines done. Loading the voice model… (isolated: ${self.crossOriginIsolated})`;
    gen.state = 'loading';
    const w = Voice.makeWorker();
    await w.load();
    gen.state = 'working';
    let sinceSave = 0;
    const t0 = performance.now();
    for (const text of todo) {
      try {
        const a = await w.gen(text);
        bank[text] = await Voice.encode(a.data, a.rate);
        gen.done++; sinceSave++;
        log(`✓ ${text}`);
      } catch (e) { gen.errors++; log(`✗ ${text}: ${e.message}`); }
      const rate = (performance.now() - t0) / 1000 / Math.max(1, gen.done - (lines.length - todo.length));
      statusEl.textContent = `${gen.done} of ${gen.total} lines done · about ${Math.round(rate * (gen.total - gen.done) / 60)} min left`;
      if (sinceSave >= 8) { await save(bank); sinceSave = 0; }
    }
    await save(bank);
    gen.state = 'done';
    statusEl.textContent = `Done: ${gen.done} of ${gen.total} lines saved to models/voice.js (${gen.errors} errors).`;
  } catch (e) {
    gen.state = 'failed: ' + e.message;
    statusEl.textContent = 'Failed: ' + e.message;
  }
})();
</script>
</body>
</html>
